name: Site critique

# Reviews the site as a buyer of cybersecurity and AI enablement consulting.
# Scheduled runs are advisory only. They must not rewrite headlines, package
# blurbs, contact, or the résumé header — those are human-owned Brand QA copy.
# Portfolio apply stays behind an explicit workflow_dispatch flag.
#
# It proposes changes, it does not publish them. The critique disagrees with
# itself between runs on judgement calls, and this site sells security services
# where a wrong claim is a professional liability, so a person merges. Nothing
# reaches stevo.ai until you do.
#
# What it may change: portfolio framing, category and order in
# content/projects.json, and the résumé's scope lines, achievement wording and
# focus areas in content/resume.json.
#
# What it can never do, enforced in code rather than asked for in the prompt
# (scripts/optimize-portfolio.mjs, scripts/optimize-resume.mjs): remove a
# project, invent a project, alter a live or source URL, add or remove a job,
# change a date or job title, drop an achievement, edit the tool inventories,
# state a figure that is not already there, or grow the résumé past the length
# that keeps it printing to two pages.
#
# Setup:
#   secrets.GROK_API_KEY  required. Create at https://console.x.ai
#   vars.GROK_MODEL       optional, defaults to grok-4.5

on:
  schedule:
    # 09:12 Monday UTC. An off-minute avoids the top-of-hour scheduling crush.
    - cron: "12 9 * * 1"
  workflow_dispatch:
    inputs:
      model:
        description: "Model override, e.g. grok-4.5 (blank uses vars.GROK_MODEL)"
        required: false
        type: string
      apply_changes:
        description: "Apply portfolio-only changes and open a pull request. Does not rewrite headlines, packages, contact, or the resume header."
        required: false
        default: false
        type: boolean

concurrency:
  group: site-critique
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  critique:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
      pull-requests: write
      # Needed to dispatch ci.yml against the branch it just pushed.
      actions: write

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Refresh discovery first, so a repository made public since the last run
      # can be promoted into the portfolio in the same pass.
      - name: Discover newly published projects
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: npm run discover

      # The critique reads the built export, so it reviews what a visitor sees.
      - name: Build static site
        run: npm run build

      - name: Confirm the API key is configured
        id: preflight
        env:
          GROK_API_KEY: ${{ secrets.GROK_API_KEY }}
        run: |
          if [[ -z "$GROK_API_KEY" ]]; then
            echo 'configured=false' >> "$GITHUB_OUTPUT"
            echo '::warning title=Site critique::GROK_API_KEY is not set, so the critique was skipped. Add it under Settings > Secrets and variables > Actions.'
          else
            echo 'configured=true' >> "$GITHUB_OUTPUT"
          fi

      - name: Critique the site
        id: critique
        if: steps.preflight.outputs.configured == 'true'
        env:
          GROK_API_KEY: ${{ secrets.GROK_API_KEY }}
          GROK_MODEL: ${{ inputs.model || vars.GROK_MODEL || 'grok-4.5' }}
          GROK_MODEL_AUTO_UPGRADE: ${{ vars.GROK_MODEL_AUTO_UPGRADE || 'true' }}
          GROK_REASONING_EFFORT: ${{ vars.GROK_REASONING_EFFORT }}
        run: npm run critique

      - name: Reframe and reorder the portfolio
        id: optimize
        if: >-
          steps.preflight.outputs.configured == 'true' &&
          github.event_name == 'workflow_dispatch' &&
          inputs.apply_changes
        env:
          GROK_API_KEY: ${{ secrets.GROK_API_KEY }}
          GROK_MODEL: ${{ steps.critique.outputs.model || inputs.model || vars.GROK_MODEL || 'grok-4.5' }}
        run: npm run optimize:portfolio


      # Résumé header, focus cards, and contact are Brand QA locked. The
      # optimizer must not run on a schedule and cannot rewrite those surfaces
      # even when a human applies portfolio changes.
      - name: Sharpen the resume wording
        id: resume
        if: false
        env:
          GROK_API_KEY: ${{ secrets.GROK_API_KEY }}
          GROK_MODEL: ${{ steps.critique.outputs.model || inputs.model || vars.GROK_MODEL || 'grok-4.5' }}
        run: npm run optimize:resume

      # Promoting a discovered project into content/projects.json means the
      # generated discovery file must drop it, or the same project exists in
      # both places. Re-running discovery reconciles that.
      - name: Reconcile discovery after promotion
        if: steps.optimize.outcome == 'success'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: npm run discover

      # A pull request is only worth opening if the site still builds and every
      # test passes, so validation runs before the branch is pushed.
      - name: Rebuild and test the edited site
        if: steps.optimize.outcome == 'success'
        run: |
          npm run lint
          npm run typecheck
          npm run build
          node --test tests/static-export.test.mjs

      - name: Open a pull request with the changes
        if: steps.optimize.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          MODEL: ${{ steps.critique.outputs.model }}
        run: |
          set -euo pipefail

          if git diff --quiet -- content/projects.json content/resume.json data/discovered.generated.json; then
            echo '### No changes proposed' >> "$GITHUB_STEP_SUMMARY"
            echo 'The advisor left the portfolio and résumé as they are.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          branch="site-critique/$(date -u '+%Y-%m-%d-%H%M')"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout -b "$branch"
          git add content/projects.json content/resume.json data/discovered.generated.json
          git commit -m "Sharpen the portfolio and resume

          Applied by the site critique workflow using ${MODEL:-grok}. Framing,
          category and display order only: no project was removed, no URL
          changed, and every figure was already present in the project's data.

          Review the reasoning and the full critique in the pull request body."
          git push origin "$branch"

          {
            echo "Applied by \`${MODEL:-grok}\` from the weekly site critique."
            echo
            echo "Wording, category and order only. It cannot remove a project or a job,"
            echo "change a URL, date or job title, drop an achievement, edit the tool"
            echo "inventories, invent a figure, or grow the résumé past two printed pages."
            echo "Those are enforced in the optimizer scripts, not asked for in the prompt."
            echo
            echo "Lint, typecheck, build and the full test suite passed before this opened."
            echo
            cat critique/portfolio-changes.md 2>/dev/null || true
            echo
            cat critique/resume-changes.md 2>/dev/null || true
            echo
            echo "<details><summary>Full advisor critique</summary>"
            echo
            sed '1,9d' critique/site-critique.md 2>/dev/null || true
            echo
            echo "</details>"
          } > /tmp/pr-body.md

          # Opening the pull request needs "Allow GitHub Actions to create and
          # approve pull requests" under Settings > Actions > General. Without
          # it the branch is still pushed and validated, so fall back to a
          # one-click compare link rather than failing a run whose work is done.
          if gh pr create \
            --title "Sharpen the portfolio and resume ($(date -u '+%Y-%m-%d'))" \
            --body-file /tmp/pr-body.md \
            --head "$branch" \
            --base main
          then
            url=$(gh pr view "$branch" --json url --jq .url)
            echo "### Pull request opened" >> "$GITHUB_STEP_SUMMARY"
            echo "$url" >> "$GITHUB_STEP_SUMMARY"

            # A pull request opened with GITHUB_TOKEN does not trigger
            # workflows, so CI would never run on it and "merge when checks
            # pass" would mean "merge with no checks". Dispatch CI against the
            # branch and gate the merge on its real verdict instead.
            if ! gh workflow run ci.yml --ref "$branch"; then
              echo "::warning title=Site critique::Could not start CI for $branch; pull request left open at $url."
              echo "CI could not be started, so $url was left open." >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            sleep 15
            run_id=""
            for _ in $(seq 1 40); do
              # Filter to workflow_dispatch. Opening the pull request also
              # queues a pull_request run, which lands a second later and sits
              # at action_required awaiting approval, so "the newest run on the
              # branch" reads that one and never resolves.
              run_id=$(gh run list --workflow=ci.yml --branch "$branch" \
                --event workflow_dispatch --limit 1 \
                --json databaseId --jq '.[0].databaseId // empty')
              [[ -n "$run_id" ]] && break
              sleep 5
            done

            if [[ -z "$run_id" ]]; then
              echo "::warning title=Site critique::CI did not start for $branch; leaving the pull request open for review."
              echo 'CI did not start, so the pull request was left open.' >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi

            conclusion=""
            for _ in $(seq 1 80); do
              read -r status conclusion <<<"$(gh run view "$run_id" \
                --json status,conclusion --jq '.status+" "+(.conclusion//"-")')"
              [[ "$status" == "completed" ]] && break
              sleep 15
            done

            if [[ "$conclusion" == "success" ]]; then
              gh pr merge "$branch" --squash --delete-branch
              # A merge pushed with GITHUB_TOKEN does not trigger the deploy
              # workflow's push event -- the same restriction that keeps CI
              # from starting on these pull requests -- so the merged changes
              # would sit on main until the daily cron. Dispatch it explicitly.
              if gh workflow run deploy-pages.yml --ref main; then
                echo "CI passed; merged and the deploy to gh-pages was dispatched." >> "$GITHUB_STEP_SUMMARY"
              else
                echo "::warning title=Site critique::Merged, but the deploy could not be dispatched; the daily deploy will pick it up."
                echo "Merged; the deploy could not be dispatched and will run on the daily schedule." >> "$GITHUB_STEP_SUMMARY"
              fi
            else
              echo "::warning title=Site critique::CI concluded \"$conclusion\"; the pull request was left open for review."
              {
                echo
                echo "CI concluded **$conclusion**, so this was *not* merged. Review it:"
                echo "$url"
              } >> "$GITHUB_STEP_SUMMARY"
            fi
          else
            {
              echo "### Branch pushed, pull request not opened"
              echo
              echo "The changes are committed and validated on \`$branch\`, but this"
              echo "repository does not allow GitHub Actions to open pull requests."
              echo
              echo "Enable **Settings → Actions → General → Allow GitHub Actions to"
              echo "create and approve pull requests**, or open it now:"
              echo
              echo "${{ github.server_url }}/${{ github.repository }}/compare/main...$branch?expand=1"
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::warning title=Site critique::Branch $branch is ready to review, but Actions cannot open pull requests. Enable it under Settings > Actions > General."
          fi

      - name: Upload the critique
        if: steps.preflight.outputs.configured == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: site-critique
          path: critique/
          retention-days: 90
          if-no-files-found: warn
