name: CI

# The deploy workflow only builds and publishes, so on its own it cannot catch
# a broken test or lint error before it ships. This job is the actual gate: it
# runs on every push and pull request, needs no secrets, and validates against
# the committed sources rather than fetching live data.

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  # Lets another workflow run these checks against a branch it just pushed.
  # A pull request opened with GITHUB_TOKEN does not trigger workflows, so the
  # site-critique job dispatches this explicitly and gates its merge on the
  # result.
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build static site
        run: npm run build

      # The build output is what the tests assert against.
      - name: Test the static export
        run: node --test tests/static-export.test.mjs

      # verify:pdf is intentionally not run here. It prints the resume with
      # headless Chrome and counts pages, but the resume's serif stack (Iowan
      # Old Style, Baskerville) does not exist on the Linux runner, so the
      # fallback font's metrics could report a different page count than a real
      # macOS or Windows browser. It stays a local pre-push check where the
      # actual fonts are present.
